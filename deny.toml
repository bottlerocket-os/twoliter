[licenses]

# We want really high confidence when inferring licenses from text
confidence-threshold = 0.93

# Commented license types are allowed but not currently used
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # "CC0-1.0",
    "ISC",
    "MIT",
    #"OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

exceptions = [
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"], version = "*" }
]

# https://github.com/hsivonen/encoding_rs The non-test code that isn't generated from the WHATWG data in this crate is
# under Apache-2.0 OR MIT. Test code is under CC0.
[[licenses.clarify]]
name = "encoding_rs"
version = "0.8.30"
expression = "(Apache-2.0 OR MIT) AND BSD-3-Clause"
license-files = [
    { path = "COPYRIGHT", hash = 0x39f8ad31 }
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

[[licenses.clarify]]
name = "rustls-webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

[[licenses.clarify]]
name = "half:1.8.3"
expression = "MIT OR Apache-2.0"
license-files = [
    { path = "LICENSES/Apache-2.0.txt", hash = 0xc80f59e5 },
    { path = "LICENSES/MIT.txt", hash = 0xb367c6ad },
]

[bans]
# Deny multiple versions or wildcard dependencies.
multiple-versions = "deny"
wildcards = "deny"

skip = [
    { name = "half" },
    # governor and guppy collide bringing two versions of hashbrown and foldhash
    { name = "hashbrown" },
    { name = "foldhash" },
    # tokio-retry uses rand 0.10 while other crates use rand 0.9
    { name = "rand" },
    # bon uses darling 0.21 while gptman uses 0.23
    { name = "darling" },
    { name = "darling_core" },
    { name = "darling_macro" },
    # Older transitive versions pulled in by build/runtime deps (fatfs, rustls'
    # ring, aws-lc-rs, coldsnap's http/hyper stack, snafu 0.7 via rpm, etc.);
    # newer versions come from the rest of the workspace.
    { name = "bitflags" },
    { name = "block-buffer" },
    { name = "const-oid" },
    { name = "cpufeatures" },
    { name = "crypto-common" },
    { name = "digest" },
    { name = "getrandom" },
    { name = "heck" },
    { name = "http" },
    { name = "http-body" },
    { name = "r-efi" },
    { name = "rand_chacha" },
    { name = "rand_core" },
    { name = "sha2" },
    { name = "snafu" },
    { name = "snafu-derive" },
    { name = "syn" },
    { name = "unicode-width" },
    { name = "untrusted" },
    { name = "windows-sys" },
    { name = "winnow" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
# Deny crates from unknown registries or git repositories.
unknown-registry = "deny"
unknown-git = "deny"
